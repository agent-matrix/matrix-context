# [v1] HTTP server + Postgres/pgvector
services:
  matrix-context:
    build: ..
    ports: ["8088:8088"]
    environment:
      MATRIX_CONTEXT_BACKEND: postgres
    depends_on: [db]
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: matrix
      POSTGRES_DB: matrix_context
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
